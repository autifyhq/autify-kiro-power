name: Release PR

on:
  push:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open or refresh the develop -> main PR if main is behind
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          ahead=$(gh api "repos/$REPO/compare/main...develop" --jq .ahead_by)
          if [ "$ahead" = "0" ]; then
            echo "main already has everything on develop"
            exit 0
          fi

          commits=$(gh api "repos/$REPO/compare/main...develop" \
            --jq '.commits[] | "- " + (.commit.message | split("\n")[0]) + " (" + .sha[0:7] + ")"')
          body=$(printf 'Merging this publishes develop to main, the branch Kiro installs from.\n\nThis PR follows develop; new pushes land here until it is merged.\n\n## Commits\n\n%s\n' "$commits")

          # The PR picks up new commits on its own; only the body needs refreshing.
          pr=$(gh pr list -R "$REPO" --base main --head develop --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh api -X PATCH "repos/$REPO/pulls/$pr" -f body="$body" --silent
          else
            gh pr create -R "$REPO" --base main --head develop \
              --title "Release: develop -> main" --body "$body"
          fi
